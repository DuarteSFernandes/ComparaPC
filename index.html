<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ComparaPC - Comparador de GPUs</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b0f17;
      color: #e2e8f0;
      padding-bottom: 40px;
    }

    header {
      background: #121826;
      border-bottom: 1px solid #1e293b;
      padding: 20px;
      text-align: center;
      margin-bottom: 20px;
    }

    header h1 {
      color: #38edf8;
      font-size: 1.8rem;
    }

    /* Layout Principal */
    .container-principal {
      display: flex;
      gap: 24px;
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 20px;
    }

    /* Sidebar de Filtros */
    .sidebar-filtros {
      width: 280px;
      flex-shrink: 0;
      background: #121826;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      height: fit-content;
      position: sticky;
      top: 20px;
    }

    .sidebar-filtros h3 {
      font-size: 1.1rem;
      color: #fff;
      margin-bottom: 20px;
    }

    .filtro-grupo {
      margin-bottom: 24px;
      border-bottom: 1px solid #1e293b;
      padding-bottom: 16px;
    }

    .filtro-grupo:last-child {
      border-bottom: none;
    }

    .titulo-grupo {
      display: block;
      font-weight: 600;
      color: #94a3b8;
      margin-bottom: 12px;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .select-ordenacao {
      width: 100%;
      padding: 10px;
      background-color: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 8px;
      color: #e2e8f0;
      font-size: 0.9rem;
      cursor: pointer;
      outline: none;
    }

    .select-ordenacao:focus {
      border-color: #38edf8;
    }

    .checkbox-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      color: #e2e8f0;
      font-size: 0.95rem;
      cursor: pointer;
    }

    .checkbox-item input[type="checkbox"] {
      width: 18px;
      height: 18px;
      accent-color: #38edf8;
      cursor: pointer;
    }

    .range-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .range-valores {
      display: flex;
      justify-content: space-between;
      color: #38edf8;
      font-weight: bold;
      font-size: 0.95rem;
    }

    input[type="range"] {
      width: 100%;
      accent-color: #38edf8;
      cursor: pointer;
    }

    /* Grelha de Produtos */
    .grelha-produtos {
      flex-grow: 1;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 20px;
    }

    .cartao-gpu {
      background: #121826;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.2s, border-color 0.2s;
    }

    .cartao-gpu:hover {
      transform: translateY(-4px);
      border-color: #38edf8;
    }

    .cartao-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 12px;
    }

    .nome-gpu {
      font-size: 1.2rem;
      font-weight: bold;
      color: #fff;
    }

    /* Badges de Desempenho */
    .badge {
      font-size: 0.75rem;
      font-weight: bold;
      padding: 4px 8px;
      border-radius: 6px;
      text-transform: uppercase;
    }
    .badge-excelente { background: #059669; color: #ecfdf5; }
    .badge-muito-bom  { background: #0284c7; color: #f0f9ff; }
    .badge-bom        { background: #d97706; color: #fffbe3; }
    .badge-suficiente { background: #475569; color: #f8fafc; }
    .badge-fraco      { background: #dc2626; color: #fef2f2; }

    .performance-info {
      font-size: 0.9rem;
      color: #94a3b8;
      margin-bottom: 16px;
    }

    .preco-destaque {
      font-size: 1.5rem;
      font-weight: bold;
      color: #38edf8;
      margin-bottom: 12px;
    }

    .lista-lojas {
      list-style: none;
      border-top: 1px solid #1e293b;
      padding-top: 12px;
    }

    .item-loja {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      margin-bottom: 6px;
      color: #cbd5e1;
    }

    /* Responsividade */
    @media (max-width: 900px) {
      .container-principal {
        flex-direction: column;
      }
      .sidebar-filtros {
        width: 100%;
        position: static;
      }
    }
  </style>
</head>
<body>

  <header>
    <h1>ComparaPC - Portugal</h1>
  </header>

  <div class="container-principal">
    
    <!-- Sidebar de Filtros -->
    <aside class="sidebar-filtros">
      <h3>Filtros</h3>

      <!-- Ordenação -->
      <div class="filtro-grupo">
        <label class="titulo-grupo">Ordenar Por</label>
        <select id="filtroOrdem" onchange="atualizarFiltros()" class="select-ordenacao">
          <option value="preco-asc">Menor Preço</option>
          <option value="preco-desc">Maior Preço</option>
          <option value="fps-desc">Mais FPS (Melhor Performance)</option>
          <option value="fps-asc">Menos FPS</option>
          <option value="nome-asc">Nome (A - Z)</option>
        </select>
      </div>

      <!-- Slider de Preço Dinâmico -->
      <div class="filtro-grupo">
        <label class="titulo-grupo">Preço Máximo</label>
        <div class="range-container">
          <input type="range" id="filtroPreco" min="0" max="3000" step="10" value="3000" oninput="atualizarFiltros()">
          <div class="range-valores">
            <span>Até:</span>
            <span id="valorPrecoLabel">--€</span>
          </div>
        </div>
      </div>

      <!-- Marca do Chip (GPU) -->
      <div class="filtro-grupo">
        <label class="titulo-grupo">Marca (Chip)</label>
        <label class="checkbox-item">
          <input type="checkbox" value="NVIDIA" class="filtro-marca" onchange="atualizarFiltros()" checked> NVIDIA
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="AMD" class="filtro-marca" onchange="atualizarFiltros()" checked> AMD
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="INTEL" class="filtro-marca" onchange="atualizarFiltros()" checked> Intel Arc
        </label>
      </div>

      <!-- Memória VRAM -->
      <div class="filtro-grupo">
        <label class="titulo-grupo">Memória VRAM</label>
        <label class="checkbox-item">
          <input type="checkbox" value="4" class="filtro-vram" onchange="atualizarFiltros()"> Até 4 GB
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="6" class="filtro-vram" onchange="atualizarFiltros()"> 6 GB
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="8" class="filtro-vram" onchange="atualizarFiltros()"> 8 GB
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="12" class="filtro-vram" onchange="atualizarFiltros()"> 12 GB / 16 GB
        </label>
        <label class="checkbox-item">
          <input type="checkbox" value="20" class="filtro-vram" onchange="atualizarFiltros()"> 20 GB ou mais
        </label>
      </div>

    </aside>

    <!-- Grelha das GPUs -->
    <main class="grelha-produtos" id="grelhaGpus"></main>

  </div>

  <script>
    let todosOsGrupos = {};

    // Mapeamento de FPS estimado a 1080p (exemplo expansível)
    const INDICE_GPU = {
      "RTX 5050": { fortnite: 120, gta: 165 },
      "RTX 4060": { fortnite: 125, gta: 170 },
      "RX 7600":  { fortnite: 115, gta: 155 },
      "GTX 1650": { fortnite: 58,  gta: 75 }
    };

    // Classificação de Badges baseada em FPS
    function obterBadgePerformance(fps) {
      if (fps >= 120) return { texto: 'EXCELENTE', classe: 'badge-excelente' };
      if (fps >= 90)  return { texto: 'MUITO BOM', classe: 'badge-muito-bom' };
      if (fps >= 60)  return { texto: 'BOM', classe: 'badge-bom' };
      if (fps >= 40)  return { texto: 'SUFICIENTE', classe: 'badge-suficiente' };
      return { texto: 'FRACO', classe: 'badge-fraco' };
    }

    // Calcula dinamicamente a GPU mais cara do precos.json para o topo do slider
    function configurarSliderDinamico(dados) {
      let precoMaximoReal = 0;

      for (const modelo in dados) {
        const ofertas = dados[modelo];
        if (Array.isArray(ofertas)) {
          ofertas.forEach(item => {
            if (item.preco && item.preco > precoMaximoReal) {
              precoMaximoReal = item.preco;
            }
          });
        }
      }

      const limiteMax = Math.ceil(precoMaximoReal / 100) * 100 || 3000;
      const slider = document.getElementById('filtroPreco');
      
      if (slider) {
        slider.max = limiteMax;
        slider.value = limiteMax;
        document.getElementById('valorPrecoLabel').innerText = `${limiteMax}€`;
      }
    }

    // Ordenação
    function ordenarGrupos(grupos, criterio) {
      const entradas = Object.entries(grupos);

      entradas.sort((a, b) => {
        const [modeloA, produtosA] = a;
        const [modeloB, produtosB] = b;

        const precoA = produtosA[0]?.preco || 0;
        const precoB = produtosB[0]?.preco || 0;

        const fpsA = INDICE_GPU[modeloA]?.fortnite || 0;
        const fpsB = INDICE_GPU[modeloB]?.fortnite || 0;

        switch (criterio) {
          case 'preco-asc':  return precoA - precoB;
          case 'preco-desc': return precoB - precoA;
          case 'fps-desc':   return fpsB - fpsA;
          case 'fps-asc':    return fpsA - fpsB;
          case 'nome-asc':   return modeloA.localeCompare(modeloB);
          default:           return 0;
        }
      });

      const ordenado = {};
      entradas.forEach(([chave, valor]) => { ordenado[chave] = valor; });
      return ordenado;
    }

    // Filtragem de dados
    function atualizarFiltros() {
      const precoMax = parseFloat(document.getElementById('filtroPreco').value);
      document.getElementById('valorPrecoLabel').innerText = `${precoMax}€`;

      const marcasSelecionadas = Array.from(document.querySelectorAll('.filtro-marca:checked')).map(cb => cb.value);
      const vramsSelecionadas = Array.from(document.querySelectorAll('.filtro-vram:checked')).map(cb => parseInt(cb.value));

      const gruposFiltrados = {};

      for (const modelo in todosOsGrupos) {
        const produtos = todosOsGrupos[modelo];
        const menorPreco = produtos[0]?.preco || 0;

        // Deteção da Marca do Chip
        let marcaModelo = 'NVIDIA';
        const mUpper = modelo.toUpperCase();
        if (mUpper.includes('RX') || mUpper.includes('RADEON') || mUpper.includes('R9') || mUpper.includes('HD ')) {
          marcaModelo = 'AMD';
        } else if (mUpper.includes('ARC') || mUpper.includes('INTEL')) {
          marcaModelo = 'INTEL';
        }

        // Extração de VRAM
        const matchVram = modelo.match(/(\d+)\s?GB/i) || produtos[0]?.nome.match(/(\d+)\s?GB/i);
        const vramModelo = matchVram ? parseInt(matchVram[1]) : 0;

        // Condições de validação
        const passaPreco = menorPreco <= precoMax;
        const passaMarca = marcasSelecionadas.includes(marcaModelo);
        
        let passaVram = true;
        if (vramsSelecionadas.length > 0) {
          passaVram = vramsSelecionadas.some(vram => {
            if (vram === 4) return vramModelo <= 4;
            if (vram === 6) return vramModelo === 6;
            if (vram === 8) return vramModelo === 8;
            if (vram === 12) return vramModelo === 12 || vramModelo === 16;
            if (vram === 20) return vramModelo >= 20;
            return false;
          });
        }

        if (passaPreco && passaMarca && passaVram) {
          gruposFiltrados[modelo] = produtos;
        }
      }

      const criterio = document.getElementById('filtroOrdem').value;
      const resultadoFinal = ordenarGrupos(gruposFiltrados, criterio);

      renderizarCartoes(resultadoFinal);
    }

    // Renderização dos cartões no HTML
    function renderizarCartoes(grupos) {
      const grelha = document.getElementById('grelhaGpus');
      grelha.innerHTML = '';

      if (Object.keys(grupos).length === 0) {
        grelha.innerHTML = '<p style="color: #94a3b8; grid-column: 1/-1;">Nenhuma placa gráfica encontrada com os filtros selecionados.</p>';
        return;
      }

      for (const modelo in grupos) {
        const ofertas = grupos[modelo];
        const menorPreco = ofertas[0]?.preco ? `${ofertas[0].preco.toFixed(2)}€` : 'N/D';
        const fpsEstimado = INDICE_GPU[modelo]?.fortnite || 60;
        const badge = obterBadgePerformance(fpsEstimado);

        let ofertasHtml = ofertas.slice(0, 3).map(o => `
          <li class="item-loja">
            <span>${o.loja || 'Loja'}</span>
            <strong>${o.preco ? o.preco.toFixed(2) + '€' : ''}</strong>
          </li>
        `).join('');

        const cartao = document.createElement('div');
        cartao.className = 'cartao-gpu';
        cartao.innerHTML = `
          <div>
            <div class="cartao-header">
              <span class="nome-gpu">${modelo}</span>
              <span class="badge ${badge.classe}">${badge.texto}</span>
            </div>
            <div class="performance-info">~${fpsEstimado} FPS em Fortnite (1080p)</div>
            <div class="preco-destaque">Desde ${menorPreco}</div>
          </div>
          <ul class="lista-lojas">${ofertasHtml}</ul>
        `;
        grelha.appendChild(cartao);
      }
    }

    // Carregamento inicial do ficheiro precos.json
    fetch('precos.json')
      .then(res => res.json())
      .then(dados => {
        todosOsGrupos = dados;
        configurarSliderDinamico(todosOsGrupos);
        atualizarFiltros();
      })
      .catch(err => console.error("Erro ao carregar o precos.json:", err));
  </script>
</body>
</html>
